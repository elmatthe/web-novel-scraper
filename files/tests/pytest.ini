# pytest settings for the webnovel-scraper suite (dev-only, not shipped). pytest finds
# this file because the suite is run as `pytest files/tests` (scripts/verify.py does so).
#
# Capture output at the sys level, not pytest's default file-descriptor level. On Windows,
# Tk 8.6 sometimes cannot read its own init.tcl when a Tk interpreter is created while
# file descriptors 1/2 are redirected: measured 2026-10-17 with a bare tk.Tk() loop, about
# 1 in 300 creations failed under --capture=fd and 0 in 900 under --capture=sys. The GUI
# tests create many windows, so fd capture made them skip at random ("no Tk display").
[pytest]
addopts = --capture=sys
